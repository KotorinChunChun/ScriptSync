[package]
name = "scriptsync"
version = "0.0.6"
description = "人間音声と合成音声の読みを照合する制作支援ツール"
authors = ["amekoro"]
license = "MIT"
edition = "2024"

[lib]
name = "scriptsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
audio_mixer_backend = { package = "microphone-recorder-example", path = "../crates/scriptsync-recorder", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hound = "3.5"
rfd = "0.15"
fs2 = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
pbkdf2 = "0.12"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop"] }

[package]
name = "scriptsync"
version = "0.0.3"
description = "人間音声と合成音声の読みを照合する制作支援ツール"
authors = ["amekoro"]
edition = "2024"

[lib]
name = "scriptsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
audio_mixer_backend = { package = "microphone-recorder-example", path = "../crates/scriptsync-recorder" }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hound = "3.5"
rfd = "0.15"
fs2 = "0.4"
base64 = "0.22"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

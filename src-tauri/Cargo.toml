[package]
name = "scriptsync"
version = "0.0.1"
description = "人間音声と合成音声の読みを照合する制作支援ツール"
authors = ["amekoro"]
edition = "2024"

[lib]
name = "scriptsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }


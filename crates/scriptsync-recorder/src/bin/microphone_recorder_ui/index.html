<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VoiceMixer 対話収録</title>
<style>body{font:16px system-ui;background:#142033;color:#edf3ff;margin:24px;max-width:1150px}button,select{font:inherit;padding:8px;border-radius:6px;border:1px solid #6580a6;background:#243b59;color:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}article{border:1px solid #476184;padding:14px;margin:10px 0;border-radius:8px}article.recording{border:3px solid #ffb85d}article p{margin:6px 0}article .prompt{text-align:left;width:100%;background:transparent;border:0}small{color:#b8cce3}.actions{display:flex;gap:8px;flex-wrap:wrap}.warning{color:#ffbe77}#status{min-height:25px}audio{width:100%}</style>
<h1>検証用音声の収録</h1><p>課題をクリックすると録音します。停止後に自動保存され、録り直しても原本は残ります。</p>
<div class="toolbar"><label>マイク <select id="device"><option value="">選択してください</option></select></label><button id="stop">録音を停止して保存</button><button id="quit">終了</button></div>
<p id="directory"></p><p id="status" role="status"></p><p id="levels"></p><audio id="preview" controls></audio><div id="prompts"></div>
<script>
const token=location.hash.slice(1),$=id=>document.getElementById(id);let recording=null,lastVersion='',audioUrl=null,polling=false,closed=false;
async function request(action,index,extra={}){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Recorder-Token':token},body:JSON.stringify({action,index,...extra})});if(!response.ok){let error=await response.json();throw new Error(error.error||'操作に失敗しました')}return response}
function stopPreview(){ $('preview').pause();if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}$('preview').removeAttribute('src') }
async function act(action,index){try{if(action==='record')stopPreview();const response=await request(action,index);if(action==='audio'||action==='derived_audio'){stopPreview();audioUrl=URL.createObjectURL(await response.blob());$('preview').src=audioUrl;await $('preview').play()}await refresh()}catch(error){$('status').textContent=error.message}}
function button(label,action,index,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=()=>act(action,index);return b}
const db=value=>(20*Math.log10(Math.max(value,1e-9))).toFixed(1);
async function refresh(){if(polling||closed)return;polling=true;try{const s=await(await request('state')).json();recording=s.recording;$('stop').disabled=recording===null;$('device').disabled=recording!==null;$('directory').textContent='保存先: '+s.directory;$('status').textContent=s.message;const warning=s.levels[0]>=.999?'クリッピング':recording!==null&&!s.session.prompts[recording].room_tone&&s.levels[0]<Math.pow(10,s.session.low_level_db/20)?'入力が小さすぎます':'';$('levels').textContent=recording===null?'':`${(s.levels[2]/1000).toFixed(1)}秒 Peak ${db(s.levels[0])} dBFS / RMS ${db(s.levels[1])} dBFS ${warning}`;
if($('device').options.length!==s.devices.length+1){$('device').replaceChildren(new Option('選択してください',''));for(const d of s.devices)$('device').appendChild(new Option(d.friendly_name,d.endpoint_id))}$('device').value=s.session.endpoint_id;
const version=JSON.stringify([s.session,recording]);if(version!==lastVersion){lastVersion=version;$('prompts').replaceChildren();s.session.prompts.forEach((p,i)=>{const row=document.createElement('article');row.classList.toggle('recording',recording===i);const start=button(`${i+1}. ${p.text}`,'record',i,recording!==null||!s.session.endpoint_id);start.className='prompt';row.appendChild(start);const take=[...p.takes].reverse().find(t=>t.status!=='failed'),last=p.takes.at(-1),info=document.createElement('p');info.className='warning';info.textContent=last?.error||(!take?'未収録':`${take.status==='warning'?'品質警告':'保存済み'}・${(take.duration_ms/1000).toFixed(1)}秒・${p.takes.length}テイク${take.quality?` / Peak ${db(take.quality.peak)} dBFS / クリップ ${take.quality.clipped_samples} / ${take.quality.low_level_warning?'小音量警告':''}`:''}`);row.appendChild(info);const actions=document.createElement('div');actions.className='actions';actions.append(button(take?'録り直し':'録音','record',i,recording!==null||!s.session.endpoint_id),button('確認再生','audio',i,recording!==null||!take),button('全無音を0.1秒へ短縮','shorten',i,recording!==null||!take),button('短縮版再生','derived_audio',i,recording!==null||!take?.derived.length),button('最新テイクを採用','accept',i,recording!==null||!take));row.appendChild(actions);$('prompts').appendChild(row)})}
}catch(error){$('status').textContent=error.message}finally{polling=false}}
$('stop').onclick=()=>act('stop');$('device').onchange=async()=>{try{await request('device',undefined,{endpoint:$('device').value});await refresh()}catch(error){$('status').textContent=error.message}};$('quit').onclick=async()=>{try{stopPreview();await request('quit');closed=true;$('status').textContent='終了しました。このタブを閉じてください。';document.querySelectorAll('button,select').forEach(el=>el.disabled=true)}catch(error){$('status').textContent=error.message}};
refresh();setInterval(refresh,300);
</script></html>
